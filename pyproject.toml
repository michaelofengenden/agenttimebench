[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttime"
version = "1.1.0.dev0"
description = "AgentTime v1.1 planning and autonomous fixture execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]==3.3.6", "psutil==7.2.2"]

[project.optional-dependencies]
harbor = ["harbor==0.23.0"]

[dependency-groups]
test = ["pgserver==0.1.4"]

[project.scripts]
agenttime = "agenttime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
