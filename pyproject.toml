[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttime"
version = "1.1.0.dev0"
description = "AgentTime v1.1 experiment planning and future execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agenttime = "agenttime.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
