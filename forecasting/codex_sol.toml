# config.toml for the no-request GPT-5.6 Sol runs (run_sol.sh). The GPQA-Diamond, AssistantBench and PPTArena
# runs were launched with service_tier = "fast".
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
service_tier = "default"
approval_policy = "never"
sandbox_mode = "danger-full-access"
